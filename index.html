function parseWorkbook(wb){
  const out = {estoque:[], cargas:[], enderecosVazios:[], paletesResumo: JSON.parse(JSON.stringify(state.data.paletesResumo))};
  const estoqueSheetName = wb.SheetNames.find(n=>n.toLowerCase().includes('estoque'));
  if(estoqueSheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[estoqueSheetName], {header:1, raw:true});
    const headerRow0 = rows[0]||[];
    const findColE = (re) => headerRow0.findIndex(h => re.test(String(h||'')));
    // colunas fixas conhecidas: SKU, DESCRICAO, CATEGORIA, VOLUME, MARCA sempre nas 5 primeiras;
    // LOTES/VALIDADE/QTD.CX/LOCALIDADE/DEPOSITO detectados por título (VALIDADE é opcional)
    const idxLote = findColE(/lote/i);
    const idxValidade = findColE(/validade/i);
    const idxQtd = findColE(/qtd\.?\s*cx/i);
    const idxLocal = findColE(/localidade/i);
    const idxDep = findColE(/^deposito/i);
    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      if(!r) continue;
      const enderecoRaw = idxLocal>=0 ? r[idxLocal] : r[7];
      if(r[0]==null || r[0]===''){
        // linha sem SKU: se tiver endereço preenchido, é uma posição vazia
        // declarada (marca o endereço como existente/disponível no mapa de
        // racks, em vez de simplesmente sumir do painel)
        if(enderecoRaw!=null && String(enderecoRaw).trim()!==''){
          out.enderecosVazios.push(String(enderecoRaw).trim());
        }
        continue;
      }
      let validade = null;
      if(idxValidade>=0 && r[idxValidade]){
        const v = r[idxValidade];
        if(v instanceof Date) validade = v.toISOString().slice(0,10);
        else if(typeof v === 'number'){ const d = XLSX.SSF.parse_date_code(v); if(d) validade = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
        else { const parsed = new Date(v); if(!isNaN(parsed)) validade = parsed.toISOString().slice(0,10); }
      }
      out.estoque.push({
        sku: Number(r[0]), descricao: String(r[1]||'').trim(), categoria: String(r[2]||'SEM CATEGORIA').trim(),
        volume: r[3]!=null?String(r[3]).trim():'', marca: r[4],
        lote: idxLote>=0 ? r[idxLote] : r[5],
        validade,
        qtdCx: Number(idxQtd>=0 ? r[idxQtd] : r[6])||0,
        endereco: enderecoRaw,
        deposito: idxDep>=0 ? r[idxDep] : r[8]
      });
    }
    // localizar o bloco de resumo de paletes (rótulo "PALETES" em alguma célula,
    // com Em Uso / Vazios (Bons, Danificados) / Total três linhas abaixo, mesma coluna em diante)
    let found = false;
    for(let i=0;i<rows.length && !found;i++){
      const r = rows[i]||[];
      for(let c=0;c<r.length;c++){
        if(String(r[c]||'').trim().toUpperCase()==='PALETES'){
          const dataRow = rows[i+3]||[];
          const emUso = Number(dataRow[c]);
          const vaziosBons = Number(dataRow[c+1]);
          const vaziosDanificados = Number(dataRow[c+2]);
          const total = Number(dataRow[c+3]);
          if(!isNaN(emUso) && !isNaN(total)){
            out.paletesResumo = {
              emUso: emUso||0,
              vaziosBons: vaziosBons||0,
              vaziosDanificados: vaziosDanificados||0,
              total: total||0
            };
            found = true;
          }
          break;
        }
      }
    }
  }
  const cargaSheets = wb.SheetNames.filter(n=>n.toLowerCase().includes('carga'));
  cargaSheets.forEach(sname=>{
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sname], {header:1, raw:true});
    if(rows.length<3) return;
    const headerRow = rows[1]||[];
    const colTitles = rows[2]||[];
    const dateMatch = String(sname).match(/(\d{2})-(\d{2})-(\d{2})/);

    // detecta dinamicamente as colunas pelo título (robusto a pequenas mudanças de ordem/posição)
    const findCol = (re) => colTitles.findIndex(h => re.test(String(h||'')));
    const idxAvaria = findCol(/avaria|descarte/i);
    const idxReembalar = findCol(/reembalar/i);
    const idxNaoVeio = findCol(/n[aã]o\s*veio|falt/i);
    const idxQuarentena = findCol(/quarentena/i);
    const idxObs = findCol(/^\s*obs/i);
    const newFormat = idxAvaria>=0 && idxReembalar>=0;

    const items = [];
    for(let i=3;i<rows.length;i++){
      const r = rows[i];
      if(!r || r[0]==null || r[0]==='') continue;
      let occ = {avariaDescarte:0, reembalar:0, naoVeio:0, quarentena:0, obs:null};
      if(newFormat){
        occ = {
          avariaDescarte: Number(r[idxAvaria])||0,
          reembalar: Number(r[idxReembalar])||0,
          naoVeio: idxNaoVeio>=0 ? (Number(r[idxNaoVeio])||0) : 0,
          quarentena: idxQuarentena>=0 ? (Number(r[idxQuarentena])||0) : 0,
          obs: idxObs>=0 ? (r[idxObs]||null) : null,
        };
      } else {
        // formato antigo (texto livre em duas colunas) — mantido por compatibilidade
        [r[10], r[11]].filter(Boolean).forEach(raw=>{
          const leg = legacyTextToFields(raw);
          occ.avariaDescarte += leg.avariaDescarte; occ.reembalar += leg.reembalar;
          occ.naoVeio += leg.naoVeio; occ.quarentena += leg.quarentena;
          if(leg.obs) occ.obs = occ.obs ? occ.obs+' / '+leg.obs : leg.obs;
        });
      }
      items.push({
        sku:Number(r[0]), descricao:String(r[1]||'').trim(), categoria:String(r[2]||'SEM CATEGORIA').trim(),
        volume:r[3]!=null?String(r[3]).trim():'', marca:r[4], qtdCx:Number(r[5])||0, lote:r[6],
        qtdConferida:Number(r[7])||0, endereco:r[8], divergencia:Number(r[9])||0, ...occ
      });
    }
    const MESES = ['','JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
    let titulo = String(headerRow[1]||'').trim();
    if(!titulo || /DATA DA CARGA/i.test(titulo) || !/CARGA/i.test(titulo)){
      titulo = dateMatch ? `CARGA ${dateMatch[1]} ${MESES[parseInt(dateMatch[2],10)]||''} 20${dateMatch[3]}`.trim() : sname;
    }
    let motorista = String(headerRow[3]||'').replace(/MOTORISTA:\s*/i,'').trim();
    if(/DATA DA CARGA/i.test(motorista)) motorista = ''; // esse campo veio com data, não com motorista
    out.cargas.push({
      id: dateMatch ? dateMatch[0] : sname,
      data: dateMatch ? `20${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}` : new Date().toISOString().slice(0,10),
      nf: String(headerRow[0]||'').replace(/NF:\s*/i,'').trim(),
      titulo,
      totalPaletesInformado: parseInt((String(headerRow[2]||'').match(/\d+/)||[0])[0],10)||0,
      motorista,
      veiculo: String(headerRow[6]||'').replace(/CAMINHAO:\s*|CARRO:\s*|VE[IÍ]CULO:\s*/i,'').trim(),
      paletesVazios: parseInt((String(headerRow[8]||'').match(/\d+/)||[0])[0],10)||0,
      items
    });
  });

  // aba SAP (confronto físico x sistema) — opcional
  const sapSheetName = wb.SheetNames.find(n=>n.toLowerCase().trim()==='sap' || n.toLowerCase().includes('sap'));
  out.sap = [];
  if(sapSheetName){
    const rowsSap = XLSX.utils.sheet_to_json(wb.Sheets[sapSheetName], {header:1, raw:true});
    const headerSap = rowsSap[0]||[];
    const findColS = (re) => headerSap.findIndex(h => re.test(String(h||'')));
    const idxSku = findColS(/produto|c[oó]digo|sku/i);
    const idxDesc = findColS(/descri[çc][aã]o/i);
    const idxLote = findColS(/lote/i);
    const idxEndereco = findColS(/pd\s*origem|posi[çc][aã]o|endere[çc]o|localidade/i);
    const idxQtd = findColS(/qtd|quantidade|dispon[ií]vel/i);
    const idxVal = findColS(/vencimento|validade/i);
    for(let i=1;i<rowsSap.length;i++){
      const r = rowsSap[i];
      if(!r || r[idxSku>=0?idxSku:0]==null || r[idxSku>=0?idxSku:0]==='') continue;
      let validade = null;
      const vraw = idxVal>=0 ? r[idxVal] : null;
      if(vraw instanceof Date) validade = vraw.toISOString().slice(0,10);
      else if(typeof vraw === 'number'){ const dd = XLSX.SSF.parse_date_code(vraw); if(dd) validade = `${dd.y}-${String(dd.m).padStart(2,'0')}-${String(dd.d).padStart(2,'0')}`; }
      else if(vraw){ const p = new Date(vraw); if(!isNaN(p)) validade = p.toISOString().slice(0,10); }
      out.sap.push({
        sku: Number(String(r[idxSku>=0?idxSku:0]).trim()),
        descricao: String((idxDesc>=0?r[idxDesc]:'')||'').trim(),
        lote: (idxLote>=0 && r[idxLote]!=null) ? r[idxLote] : null,
        endereco: idxEndereco>=0 ? (r[idxEndereco]!=null ? String(r[idxEndereco]).trim() : null) : null,
        qtd: Number(idxQtd>=0 ? r[idxQtd] : 0)||0,
        validade
      });
    }
  } else {
    out.sap = JSON.parse(JSON.stringify(state.data.sap||[]));
  }
  return out;
}
function legacyTextToFields(raw){
  const res = {avariaDescarte:0, reembalar:0, naoVeio:0, quarentena:0, obs:null};
  const t = String(raw).toLowerCase();
  const m = t.match(/(\d+)/);
  const qtd = m ? parseInt(m[1],10) : 0;
  if(t.includes('reembalar')) res.reembalar = qtd;
  else if(t.includes('descarte')) res.avariaDescarte = qtd;
  else if(t.includes('não veio')||t.includes('nao veio')) res.naoVeio = qtd;
  else if(t.includes('quarentena')) res.quarentena = qtd;
  else if(!t.includes('ok')) res.obs = raw;
  return res;
}

document.getElementById('btn-export').addEventListener('click', ()=>{
  const wb = XLSX.utils.book_new();
  const estHeader = ['COD_SKU','DESCRICAO_SKU','CATEGORIA','VOLUME','MARCA','LOTES','VALIDADE','QTD.CX','LOCALIDADE','DEPOSITO'];
  const pr = state.data.paletesResumo;
  const paletesData   = [pr.emUso,pr.vaziosBons,pr.vaziosDanificados,pr.total];
  const estRows = [
    estHeader.concat(['', 'PALETES']),
    ...state.data.estoque.map((r,i)=>{
      const row = [r.sku,r.descricao,r.categoria,r.volume,r.marca,r.lote,r.validade,r.qtdCx,r.endereco,r.deposito];
      if(i===0) row.push('', 'Em Uso', 'Vazios', '', 'Total');
      else if(i===1) row.push('', '', 'Bons', 'Danificados');
      else if(i===2) row.push('', paletesData[0], paletesData[1], paletesData[2], paletesData[3]);
      return row;
    })
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(estRows), 'Estoque');

  state.data.cargas.forEach(c=>{
    const rows = [
      ['FOLHA DE CONFERÊNCIA DE ENTRADA'],
      [`NF: ${c.nf}`, c.titulo, `TOTAL ${c.totalPaletesInformado} PALETES`, `MOTORISTA: ${c.motorista}`, '', '', `VEÍCULO: ${c.veiculo}`, '', `PALETES VAZIOS: ${c.paletesVazios}`],
      ['COD_SKU','DESCRICAO_SKU','CATEGORIA','VOLUM.','MARCA','QTD.CX','LOTE','QTD CONFERIDA','ENDEREÇO','DIVERGENCIA','AVARIA','REEMBALAR','OBS'],
      ...c.items.map(it=>[it.sku,it.descricao,it.categoria,it.volume,it.marca,it.qtdCx,it.lote,it.qtdConferida,it.endereco,it.divergencia,it.avariaDescarte||'',it.reembalar||'',it.obs]),
    ];
    const totalCx = c.items.reduce((s,it)=>s+(it.qtdCx||0),0);
    const totalConf = c.items.reduce((s,it)=>s+(it.qtdConferida||0),0);
    rows.push([null,null,null,null,null,totalCx,null,totalConf,null,totalConf-totalCx]);
    const sheetName = `Carga ${c.id}`.slice(0,31);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  });

  if((state.data.sap||[]).length){
    const sapRows = [
      ['Produto','Descrição breve do produto','Lote','Qtd.disponível','Data do vencimento'],
      ...state.data.sap.map(r=>[r.sku, r.descricao, r.lote, r.qtd, r.validade])
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sapRows), 'SAP');
  }

  XLSX.writeFile(wb, 'Estoque_BH_export.xlsx');
  toast('Planilha exportada com sucesso.');
});

document.getElementById('btn-reset').addEventListener('click', ()=>{
  state.data = JSON.parse(JSON.stringify(ORIGINAL));
  state.search=''; state.categoria=''; state.from=null; state.to=null; state.addressFilter=null; state.openCarga=null;
  document.getElementById('f-search').value='';
  document.getElementById('f-categoria').value='';
  document.getElementById('f-from').value='';
  document.getElementById('f-to').value='';
  populateCategoriaFilter();
  renderAll();
  toast('Dados originais da planilha restaurados.');
});
